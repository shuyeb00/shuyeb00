<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Rabona: a football-themed interpreted language with its own lexer, parser and runtime. C, Flex, Bison.">
<defs><pattern id="d" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10.0" cy="10.0" r="1.1" fill="#2c2358"/></pattern><clipPath id="c"><rect x="2" y="2" width="582" height="282" rx="20"/></clipPath></defs>
<rect x="14" y="14" width="582" height="282" rx="20" fill="#a98bff"/>
<rect x="2" y="2" width="582" height="282" rx="20" fill="#1c1540"/>
<g clip-path="url(#c)"><rect x="2" y="2" width="582" height="282" fill="url(#d)" opacity="0.6"/><rect x="345" y="146" width="230" height="92" rx="10" fill="#120d26" opacity="0.8"/><text x="360" y="170" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#a98bff" xml:space="preserve">tactic points(wins) {</text><text x="360" y="190" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#b9b0da" xml:space="preserve">    shoot wins * 3;</text><text x="360" y="210" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#b9b0da" xml:space="preserve">}</text><text x="360" y="230" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#a98bff" xml:space="preserve">kickoff { chant &quot;GOAL&quot;; }</text></g>
<rect x="2" y="2" width="582" height="282" rx="20" fill="none" stroke="#fff4e0" stroke-width="3"/>
<text x="28" y="44" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#a98bff">LANGUAGE DESIGN</text>
<g transform="translate(363.2 25) rotate(4 98.42 12)"><g><rect x="3" y="3" width="196.8" height="24" rx="12.0" fill="#120d26"/><rect x="0" y="0" width="196.8" height="24" rx="12.0" fill="#a98bff" stroke="#120d26" stroke-width="2"/><text x="98.42" y="15.96" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1" fill="#120d26">LEXER → AST → RUNTIME</text></g></g>
<text x="28" y="92" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="#fff4e0">Rabona</text>
<text x="28" y="120" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#a98bff">A football-themed programming language</text>
<text x="28" y="156" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#b9b0da">Own lexer, parser and tree-walking</text>
<text x="28" y="178" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#b9b0da">interpreter. Files end in .rbn.</text>
